<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Card Component - Like System</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        #root {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* Animated Background Strips */
        .background-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .strip {
            position: absolute;
            background: linear-gradient(90deg,
                    transparent,
                    rgba(255, 255, 255, 0.1),
                    transparent);
            transform: rotate(-45deg);
            animation: slideStrip linear infinite;
        }

        @keyframes slideStrip {
            from {
                transform: translateX(-100%) rotate(-45deg);
            }

            to {
                transform: translateX(200vw) rotate(-45deg);
            }
        }

        /* Hearts Animation Overlay */
        .hearts-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            /* Smooth 0.8s ease-out fade transition */
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hearts-container.active {
            opacity: 1;
        }

        .floating-heart {
            position: absolute;
            animation: floatHeart linear forwards;
            will-change: transform, opacity;
        }

        /* Smooth keyframe floating + gradual fade out */
        @keyframes floatHeart {
            0% {
                opacity: 0;
                transform: translateY(0) scale(0.2) rotate(0deg);
            }

            15% {
                opacity: 0.9;
                transform: translateY(-60px) scale(1.1) rotate(20deg);
            }

            60% {
                opacity: 0.7;
                transform: translateY(-50vh) scale(1) rotate(90deg);
            }

            100% {
                opacity: 0;
                transform: translateY(-90vh) scale(0.5) rotate(180deg);
            }
        }

        .app-header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
        }

        .app-header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .app-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .card-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .card-title {
            flex: 1;
        }

        .card-title h2 {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 5px;
        }

        .card-title p {
            color: #888;
            font-size: 0.9rem;
        }

        .card-body {
            margin-bottom: 25px;
            color: #555;
            line-height: 1.6;
            font-size: 1rem;
        }

        .card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 20px;
            border-top: 2px solid #f0f0f0;
        }

        .like-status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 1rem;
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .status-badge.liked {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            animation: pulse 0.5s ease;
        }

        .status-badge.not-liked {
            background: #e0e0e0;
            color: #666;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }
        }

        .like-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .like-button:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .like-button:active {
            transform: scale(0.95);
        }

        .like-button.liked {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .heart-icon {
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .heart-icon.animate {
            animation: heartBeat 0.5s ease;
        }

        @keyframes heartBeat {

            0%,
            100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.3);
            }

            50% {
                transform: scale(1.1);
            }

            75% {
                transform: scale(1.2);
            }
        }

        .stats {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .stats h3 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
        }

        .stat-item {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
        }

        .stat-item .number {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-item .label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .heart-svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        @media (max-width: 768px) {
            .app-header h1 {
                font-size: 2rem;
            }

            .cards-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Heart SVG Icon Component
        const HeartIcon = ({ filled }) => (
            <svg className="heart-svg" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                    fill={filled ? "currentColor" : "none"}
                    stroke="currentColor"
                    strokeWidth="2" />
            </svg>
        );

        // Background Strips Component
        const BackgroundStrips = () => {
            const strips = [];
            for (let i = 0; i < 15; i++) {
                const style = {
                    width: `${Math.random() * 200 + 100}px`,
                    height: `${Math.random() * 400 + 200}px`,
                    top: `${Math.random() * 100}%`,
                    left: `${Math.random() * 100}%`,
                    animationDuration: `${Math.random() * 10 + 15}s`,
                    animationDelay: `${Math.random() * 5}s`
                };
                strips.push(<div key={i} className="strip" style={style}></div>);
            }
            return <div className="background-animation">{strips}</div>;
        };

        // Hearts Animation Component
        const HeartsAnimation = ({ isActive, onComplete }) => {
            const [hearts, setHearts] = useState([]);
            const [visible, setVisible] = useState(false);

            useEffect(() => {
                if (isActive) {
                    // Create random heart elements
                    const newHearts = [];
                    for (let i = 0; i < 35; i++) {
                        const style = {
                            left: `${Math.random() * 100}%`,
                            bottom: `${Math.random() * 15}%`,
                            animationDuration: `${Math.random() * 1.2 + 1.5}s`,
                            animationDelay: `${Math.random() * 0.3}s`,
                            color: ['#f093fb', '#f5576c', '#ff6b9d', '#e0c3fc'][Math.floor(Math.random() * 4)],
                            fontSize: `${Math.random() * 24 + 16}px`
                        };
                        newHearts.push(
                            <svg key={i} className="floating-heart" style={style} viewBox="0 0 24 24" width="36" height="36">
                                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
                                    fill={style.color} />
                            </svg>
                        );
                    }
                    setHearts(newHearts);
                    setVisible(true);

                    // Stage 1: Trigger gentle fade out of the container after 1s
                    const fadeTimer = setTimeout(() => {
                        setVisible(false);
                    }, 1000);

                    // Stage 2: Completely unmount hearts after fade transition finishes (1.8s total)
                    const cleanupTimer = setTimeout(() => {
                        setHearts([]);
                        onComplete();
                    }, 1800);

                    return () => {
                        clearTimeout(fadeTimer);
                        clearTimeout(cleanupTimer);
                    };
                }
            }, [isActive, onComplete]);

            return (
                <div className={`hearts-container ${visible ? 'active' : ''}`}>
                    {hearts}
                </div>
            );
        };

        // Card Component
        function Card({ title, description, iconLetter, category, onLike }) {
            const [isLiked, setIsLiked] = useState(false);
            const [animate, setAnimate] = useState(false);

            const handleLike = () => {
                const newLikedState = !isLiked;
                setIsLiked(newLikedState);
                setAnimate(true);

                if (newLikedState) {
                    onLike();
                }

                setTimeout(() => setAnimate(false), 500);
            };

            return (
                <div className="card">
                    <div className="card-header">
                        <div className="card-icon">
                            {iconLetter}
                        </div>
                        <div className="card-title">
                            <h2>{title}</h2>
                            <p>{category}</p>
                        </div>
                    </div>

                    <div className="card-body">
                        <p>{description}</p>
                    </div>

                    <div className="card-footer">
                        <div className="like-status">
                            <span className={`status-badge ${isLiked ? 'liked' : 'not-liked'}`}>
                                {isLiked ? 'Liked' : 'Not Liked'}
                            </span>
                        </div>

                        <button
                            className={`like-button ${isLiked ? 'liked' : ''}`}
                            onClick={handleLike}
                        >
                            <span className={`heart-icon ${animate ? 'animate' : ''}`}>
                                <HeartIcon filled={isLiked} />
                            </span>
                            {isLiked ? 'Unlike' : 'Like'}
                        </button>
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [showHearts, setShowHearts] = useState(false);
            const [cards] = useState([
                {
                    id: 1,
                    title: "Beautiful Sunset",
                    description: "Experience the mesmerizing colors of nature as the sun sets over the horizon, painting the sky with vibrant hues of orange and pink.",
                    iconLetter: "NS",
                    category: "Nature"
                },
                {
                    id: 2,
                    title: "Mountain Adventure",
                    description: "Embark on an exciting journey through majestic mountain peaks, where fresh air and stunning views await at every turn.",
                    iconLetter: "MA",
                    category: "Travel"
                },
                {
                    id: 3,
                    title: "Ocean Waves",
                    description: "Listen to the soothing sounds of ocean waves crashing against the shore, bringing peace and tranquility to your soul.",
                    iconLetter: "OW",
                    category: "Nature"
                },
                {
                    id: 4,
                    title: "Coffee Break",
                    description: "Take a moment to enjoy a perfectly brewed cup of coffee, the perfect companion for your relaxation and creativity.",
                    iconLetter: "CB",
                    category: "Lifestyle"
                },
                {
                    id: 5,
                    title: "City Lights",
                    description: "Marvel at the dazzling urban landscape as city lights illuminate the night sky, creating a magical metropolitan atmosphere.",
                    iconLetter: "CL",
                    category: "Urban"
                },
                {
                    id: 6,
                    title: "Reading Time",
                    description: "Dive into the wonderful world of books, where every page turns into a new adventure and knowledge awaits discovery.",
                    iconLetter: "RT",
                    category: "Education"
                }
            ]);

            const handleCardLike = () => {
                setShowHearts(true);
            };

            const handleHeartsComplete = () => {
                setShowHearts(false);
            };

            return (
                <div>
                    <BackgroundStrips />
                    <HeartsAnimation isActive={showHearts} onComplete={handleHeartsComplete} />

                    <div className="app-header">
                        <h1>React Like Cards</h1>
                        <p>Click the like button to show your appreciation!</p>
                    </div>

                    <div className="cards-container">
                        {cards.map(card => (
                            <Card
                                key={card.id}
                                title={card.title}
                                description={card.description}
                                iconLetter={card.iconLetter}
                                category={card.category}
                                onLike={handleCardLike}
                            />
                        ))}
                    </div>

                    <div className="stats">
                        <h3>Statistics</h3>
                        <div className="stats-grid">
                            <div className="stat-item">
                                <div className="number">{cards.length}</div>
                                <div className="label">Total Cards</div>
                            </div>
                            <div className="stat-item">
                                <div className="number">6</div>
                                <div className="label">Categories</div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

</body>

</html>
